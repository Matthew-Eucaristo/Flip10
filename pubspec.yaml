name: flip10
description: "A focused offline Shut the Box dice game for Android, iOS, and web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8

  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.5.5
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/svg/board/
    - assets/svg/dice/
    - assets/svg/tiles/
    - assets/svg/misc/
    - assets/audio/
